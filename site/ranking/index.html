<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07173a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="スパ研">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/base.css">
<title>スパーキーランキング | スパ研便利ツール</title>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <span class="crest">⚡ SPARKY RANKING</span>
    <a class="cr-btn" href="/">← トップ</a>
  </div>
  <div id="main"></div>
  <p class="fine">This material is unofficial and is not endorsed by Supercell.<br>For more information see Supercell's Fan Content Policy: www.supercell.com/fan-content-policy.</p>
</div>
<button id="refresh" class="refresh" aria-label="更新">⟳</button>
<script src="/sparky-view.js"></script>
<script>
  // スパーキーランキングの集計結果は Sparkylab リポジトリにある(誰でも見られる公開データ)
  SparkyView.mount(document.getElementById("main"), { repo: "gabcat-fugyu/Sparkylab", branch: "main" });
  const $refresh = document.getElementById("refresh");
  $refresh.onclick = async () => {
    $refresh.classList.add("busy");
    try { await SparkyView.reload(); } finally { $refresh.classList.remove("busy"); }
  };
</script>
</body>
</html>
