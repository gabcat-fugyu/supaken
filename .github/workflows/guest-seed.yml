name: メンバー以外の許可を入れる(1回だけ)

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 実行
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute supaken --remote --command "INSERT OR IGNORE INTO allowed_users (id, name, added_at) VALUES ('smap7069', NULL, datetime('now')), ('gtr8810', NULL, datetime('now')), ('tukimihonbu', NULL, datetime('now'))"
