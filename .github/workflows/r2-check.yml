name: 接続確認

# R2とクラロワAPIの合鍵が正しく登録できているかを確かめる。確認できたら消してよい。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/r2-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - name: 書き込みと読み出し
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          python - <<'PY'
          import os, boto3, datetime
          for k in ("R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "R2_ENDPOINT"):
              print(k, "OK" if os.environ.get(k) else "未登録")
          ep = os.environ["R2_ENDPOINT"].strip().rstrip("/")
          # バケット名まで含めて貼られていても動くようにする
          if ep.endswith("/supaken-data"):
              ep = ep[: -len("/supaken-data")]
          s3 = boto3.client("s3", endpoint_url=ep,
                            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"].strip(),
                            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"].strip(),
                            region_name="auto")
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          s3.put_object(Bucket="supaken-data", Key="_check.txt", Body=f"ok {now}".encode())
          body = s3.get_object(Bucket="supaken-data", Key="_check.txt")["Body"].read().decode()
          print("読み出し:", body)
          print("中身:", [o["Key"] for o in s3.list_objects_v2(Bucket="supaken-data").get("Contents", [])])
          PY
      - name: クラロワAPI
        env:
          CR_API_TOKEN: ${{ secrets.CR_API_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          tok = os.environ.get("CR_API_TOKEN", "").strip()
          print("CR_API_TOKEN", "OK" if tok else "未登録")
          req = urllib.request.Request("https://proxy.royaleapi.dev/v1/players/%23C22R8GLC", headers={
              "Authorization": f"Bearer {tok}", "Accept": "application/json",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("取得できた:", json.loads(r.read())["name"])
          except urllib.error.HTTPError as e:
              print("失敗:", e.code, e.read()[:300]); raise SystemExit(1)
          PY
