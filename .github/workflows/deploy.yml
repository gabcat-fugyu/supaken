name: サイトを公開

# 画面や入口のプログラムを変えたら Cloudflare に公開する
on:
  workflow_dispatch:
  push:
    paths:
      - "site/**"
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare へ公開
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            # ログ画面を開かなくても原因が分かるよう、最後の部分をエラー表示に出す
            echo "::error title=wrangler deploy::$(tail -c 1800 deploy.log | tr '\n' ' ' | sed 's/\x1b\[[0-9;]*m//g')"
          fi
          exit $status
