name: サイトの動作確認

# 公開したサイトが開けるか、メン限のデータが守られているかを外から確かめる
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-site.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 確認
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          from urllib.parse import urlparse, parse_qs

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *a, **k): return None
          opener = urllib.request.build_opener(NoRedirect)

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 supaken-check"})
              try:
                  r = opener.open(req, timeout=30)
                  return r.status, r.headers, r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers, e.read()
              except Exception as e:
                  return None, {}, str(e).encode()

          B = "https://supaken.com"
          out = []
          for attempt in range(8):                 # 新しいドメインは行き渡るまで少しかかる
              st, h, body = get(B + "/")
              if st == 200: break
              time.sleep(20)
          out.append(f"トップ: {st} タイトル入り={'スパ研便利ツール' in body.decode('utf-8','ignore')}")
          st, h, body = get(B + "/ranking/"); out.append(f"ランキング: {st} 部品入り={'SparkyView.mount' in body.decode('utf-8','ignore')}")
          st, h, body = get(B + "/member/"); out.append(f"メン限ページ: {st} ログイン画面入り={'showAuth' in body.decode('utf-8','ignore')}")
          st, h, body = get("https://member.supaken.com/"); out.append(f"前のリンク: {st} → {h.get('location')}")
          st, h, body = get(B + "/api/data/index.json"); out.append(f"未ログインのデータ: {st}")
          st, h, body = get(B + "/api/profile"); out.append(f"未ログインのプロフィール: {st}")
          st, h, body = get(B + "/api/discord/login")
          q = parse_qs(urlparse(h.get("location") or "").query)
          out.append(f"Discordログイン: {st} redirect={q.get('redirect_uri')}")
          st, h, body = get(B + "/assets/icon-192.png"); out.append(f"画像: {st} {len(body)}バイト")
          st, h, body = get(B + "/sparky-view.js"); out.append(f"sparky-view.js: {st}")
          st, h, body = get(B + "/titles.css"); out.append(f"titles.css: {st}")
          st, h, body = get(B + "/decks/"); out.append(f"デッキランキング: {st}")
          st, h, body = get(B + "/player/"); out.append(f"プレイヤー検索: {st}")
          st, h, body = get("https://member.supaken.com/player/"); out.append(f"前のリンク(別ページ): {st} → {h.get('location')}")
          st, h, body = get(B + "/api/public/player?tag=PRRRPLQGR")
          try:
              d = json.loads(body); out.append(f"検索API: {st} 名前={d['player']['name']} 対戦={len(d['battles'])} cache={h.get('cache-control')}")
          except Exception:
              out.append(f"検索API: {st} {body[:200]!r}")
          st, h, body = get(B + "/api/public/player?tag=ZZZZ"); out.append(f"検索API(おかしなタグ): {st}")
          st, h, body = get(B + "/app/"); out.append(f"グループランキング: {st}")
          st, h, body = get(B + "/api/app/me"); out.append(f"グループ(未ログイン): {st}")
          st, h, body = get(B + "/api/google/login")
          out.append(f"Googleログイン: {st} → {(h.get('location') or '')[:40]}")
          # お知らせ欄は1ステップ10件までしか出ないので、3行ずつまとめて出す
          for line in out:
              print(line)
          for i in range(0, len(out), 3):
              print(f"::notice title=確認{i // 3 + 1}::{' / '.join(out[i:i + 3])}")
          PY
