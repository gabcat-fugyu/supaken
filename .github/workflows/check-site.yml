name: サイトの動作確認

# 公開したサイトが開けるか、データが読めるかを外から確かめる
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-site.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 確認
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 supaken-check"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.headers.get("content-type"), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("content-type"), e.read()
              except Exception as e:
                  return None, None, str(e).encode()
          out = []
          for attempt in range(6):
              st, ct, body = get("https://member.supaken.com/")
              if st == 200: break
              time.sleep(20)
          out.append(f"トップ: {st} {ct} {len(body)}バイト title={'CLASH BATTLE LOG' in body.decode('utf-8','ignore')}")
          st, ct, body = get("https://member.supaken.com/api/data/index.json")
          if st == 200:
              d = json.loads(body)
              out.append(f"index.json: {st} 更新 {d.get('updatedAt')} / {len(d.get('players', []))}人")
              tag = d["players"][0]["tag"].lstrip("#")
              st2, _, b2 = get(f"https://member.supaken.com/api/data/{tag}/recent.json")
              out.append(f"{tag}/recent.json: {st2} {len(b2)}バイト")
          else:
              out.append(f"index.json: {st} {body[:200]!r}")
          st, _, body = get("https://member.supaken.com/assets/icon-192.png")
          out.append(f"画像: {st} {len(body)}バイト")
          for line in out:
              print(line)
              print(f"::notice title=確認::{line}")
          PY
