# メンバー用アプリ(member.supaken.com)の設定
name = "supaken-member"
main = "worker/member.js"
compatibility_date = "2025-09-01"
workers_dev = false

# 画面のファイル(HTML・画像など)
[assets]
directory = "site/member"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 戦績データの置き場
[[r2_buckets]]
binding = "DATA"
bucket_name = "supaken-data"

# ログイン用のデータベース。database_id は公開のときに自動で埋める(deploy.yml)
[[d1_databases]]
binding = "DB"
database_name = "supaken"
database_id = "__D1_ID__"

[vars]
# 管理人のタグ(カンマ区切り)。称号の付与などができる
ADMIN_TAGS = ""
# Discord でログインするときの判定。このサーバーでこのロールを持っている人がメン限ページに入れる
DISCORD_GUILD_ID = "1418622264542236697"
DISCORD_MEMBER_ROLE_ID = "1525382489558745209"

[[routes]]
pattern = "member.supaken.com"
custom_domain = true
