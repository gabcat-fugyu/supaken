# メンバー用アプリ(member.supaken.com)の設定
name = "supaken-member"
main = "worker/member.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 画面のファイル(HTML・画像など)
[assets]
directory = "site/member"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 戦績データの置き場
[[r2_buckets]]
binding = "DATA"
bucket_name = "supaken-data"

[[routes]]
pattern = "member.supaken.com"
custom_domain = true
