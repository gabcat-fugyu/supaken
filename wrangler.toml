# supaken.com の設定(トップ・スパーキーランキング・メン限ページ)
name = "supaken-member"
main = "worker/member.js"
compatibility_date = "2025-09-01"
workers_dev = false

# 画面のファイル(HTML・画像など)
[assets]
directory = "site"
binding = "ASSETS"
# member.supaken.com の転送のため、全部のリクエストで入口を通す
run_worker_first = true

# 戦績データの置き場
[[r2_buckets]]
binding = "DATA"
bucket_name = "supaken-data"

# ログイン用のデータベース。database_id は公開のときに自動で埋める(deploy.yml)
[[d1_databases]]
binding = "DB"
database_name = "supaken"
database_id = "__D1_ID__"

[vars]
# 管理人の Discord ユーザーID(カンマ区切り)。全員のアカウント登録を外せる
ADMIN_DISCORD_IDS = "757372889136889906"
# Discord でログインするときの判定。このサーバーでこのロールを持っている人がメン限ページに入れる
DISCORD_GUILD_ID = "1418622264542236697"
DISCORD_MEMBER_ROLE_ID = "1525382489558745209"

[[routes]]
pattern = "supaken.com"
custom_domain = true

# 前のリンク。開くと supaken.com/member/ へ転送する
[[routes]]
pattern = "member.supaken.com"
custom_domain = true
